services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: numa, POSTGRES_PASSWORD: numa, POSTGRES_DB: numa }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  # Optional full stack: `docker compose --profile app up --build` (needs a filled .env for the secrets/addresses)
  api:
    profiles: ["app"]
    build: { context: ., dockerfile: docker/api.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://numa:numa@postgres:5432/numa
      PORT: "8787"
    ports: ["8787:8787"]
    depends_on: [postgres]
volumes:
  pgdata:
