name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ts:
    name: TypeScript (typecheck, lint, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: numa, POSTGRES_PASSWORD: numa, POSTGRES_DB: numa_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U numa" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://numa:numa@localhost:5432/numa_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  contracts:
    name: Contracts (forge build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build --sizes
      - run: forge test -vv
